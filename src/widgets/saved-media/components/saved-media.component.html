<div class="saved container">
  <div class="saved-buttons">
    <button class="saved-buttons_video" (click)="changeTab(0)" [class.active]="!currentTab">
      <org-overflow-marquee [text]="videoLabel$i()"></org-overflow-marquee>
    </button>
    <button (click)="changeTab(1)" [class.active]="currentTab">
      <org-overflow-marquee [text]="audioLabel$i()"></org-overflow-marquee>
    </button>
  </div>

  @if(currentTab) {
  <org-audio-block></org-audio-block>
  } @else {
  <org-video-block [videos]="(userData$ | async)?.videos || []" [isOwn]="true"></org-video-block>
  }
</div>
