<div class="lang">
  <button
    class="lang-select"
    type="button"
    [attr.aria-label]="langService.uiText('Change language')"
    [attr.aria-expanded]="isOpen"
    (click)="handleLangClick()"
  >
    <svg class="lang-select_icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <path d="M12 3c2.25 2.45 3.4 5.45 3.4 9s-1.15 6.55-3.4 9" />
      <path d="M12 3c-2.25 2.45-3.4 5.45-3.4 9s1.15 6.55 3.4 9" />
    </svg>
  </button>

  <div class="lang-options" [class.--open]="isOpen">
    @for (language of languagesList; track language) {
    <button
      type="button"
      (click)="setLanguage(language)"
      class="lang-options_item"
      [class.--current]="currentLang$i() === language"
    >
      {{ language === 'ARM' ? 'Հայերեն' : language }}
    </button>
    }
  </div>
</div>
