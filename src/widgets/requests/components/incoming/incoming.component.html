<div class="incoming">
  @if (incomingReq$ | async) { @for (req of (incomingReq$ | async); track req) {
  <div class="incoming-req">
    <div>
      <span
        [orgText]="{
          ENG: 'You are requested by user:',
          ESP: '',
          RUS: 'Запрос в доверенные пользователи от:',
        }"
      >
        You are requesting a user:
      </span>
      <b>{{ req }}</b>
    </div>

    <div class="buttons">
      <button
        (click)="acceptReq(req)"
        class="btn-secondary"
        [orgText]="{
        ENG: 'Accept',
        ESP: '',
        RUS: 'Принять',
      }"
      >
        Принять
      </button>
      <button
        (click)="rejectReq(req)"
        class="btn-err"
        [orgText]="{
        ENG: 'Decline',
        ESP: '',
        RUS: 'Отклонить',
      }"
      >
        Отклонить
      </button>
    </div>
  </div>
  } } @else {
  <span
    [orgText]="{
          ENG: 'There are no incoming requests.',
          ESP: 'No hay solicitudes salientes.',
          RUS: 'Нет исходящих запросов.',
        }"
  >
    There are no incoming requests.
  </span>
  }
</div>
